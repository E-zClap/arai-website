# Reverse-proxy block for the API. Paste this INSIDE the existing
# `server { ... listen 443 ssl; ... }` block in
# /etc/nginx/sites-available/arai-website, above the `location / { ... }` line.
#
# It forwards /api/* to the FastAPI service on 127.0.0.1:8000. The full URI
# (including the /api prefix) is preserved, matching the FastAPI routes.

location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}
